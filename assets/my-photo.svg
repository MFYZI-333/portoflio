<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="800" height="1000">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050b18" />
      <stop offset="40%" stop-color="#0a192f" />
      <stop offset="80%" stop-color="#030712" />
      <stop offset="100%" stop-color="#000000" />
    </linearGradient>

    <!-- Cosmic Glow Gradients -->
    <radialGradient id="cyanCore" cx="50%" cy="38%" r="45%">
      <stop offset="0%" stop-color="#00f5ff" stop-opacity="0.35" />
      <stop offset="50%" stop-color="#0066ff" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="faceShade" cx="48%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#e2d4c5" />
      <stop offset="45%" stop-color="#c4a58b" />
      <stop offset="85%" stop-color="#46362e" />
      <stop offset="100%" stop-color="#141018" />
    </radialGradient>

    <linearGradient id="suitGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#121826" />
      <stop offset="30%" stop-color="#1f293d" />
      <stop offset="70%" stop-color="#0b0f19" />
      <stop offset="100%" stop-color="#03050a" />
    </linearGradient>

    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f5ff" />
      <stop offset="100%" stop-color="#0088ff" />
    </linearGradient>

    <linearGradient id="neonRed" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff0055" />
      <stop offset="100%" stop-color="#ff3300" />
    </linearGradient>

    <!-- Filters -->
    <filter id="glowFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="800" height="1000" fill="url(#bgGrad)" />
  <circle cx="400" cy="380" r="350" fill="url(#cyanCore)" />

  <!-- Distant Stars on Backdrop -->
  <g opacity="0.6">
    <circle cx="150" cy="180" r="1.5" fill="#ffffff" />
    <circle cx="280" cy="90" r="1.2" fill="#00f5ff" />
    <circle cx="680" cy="140" r="1.8" fill="#ffffff" />
    <circle cx="720" cy="290" r="1.3" fill="#00a8ff" />
    <circle cx="110" cy="420" r="2" fill="#ffffff" />
    <circle cx="220" cy="580" r="1" fill="#ffffff" />
    <circle cx="710" cy="620" r="1.4" fill="#00f5ff" />
  </g>

  <!-- Futuristic Astronaut / Hero Silhouette & Armor -->
  <g id="body-suit">
    <!-- Suit Shoulders & Torso -->
    <path d="M120 1000 L220 700 L300 660 L380 680 L420 680 L500 660 L580 700 L680 1000 Z" fill="url(#suitGrad)" stroke="#1e293b" stroke-width="2" />
    <!-- Armor Plates & Tech Seams -->
    <path d="M260 740 L380 770 L420 770 L540 740" fill="none" stroke="#00f5ff" stroke-width="1.5" stroke-opacity="0.6" filter="url(#glowFilter)" />
    <path d="M300 810 L400 840 L500 810" fill="none" stroke="#0066ff" stroke-width="2" stroke-opacity="0.5" />
    <path d="M400 780 L400 950" fill="none" stroke="#00f5ff" stroke-width="2" stroke-dasharray="8,6" stroke-opacity="0.7" />
    
    <!-- Chest Arc Core / Energy Crest -->
    <circle cx="400" cy="740" r="28" fill="#061224" stroke="#00f5ff" stroke-width="2.5" />
    <circle cx="400" cy="740" r="18" fill="#00f5ff" fill-opacity="0.25" filter="url(#glowFilter)" />
    <polygon points="400,724 414,748 386,748" fill="#00f5ff" />

    <!-- Collar / High Tech Neck Ring -->
    <path d="M290 620 C290 620 330 670 400 670 C470 670 510 620 510 620 L480 570 C440 600 360 600 320 570 Z" fill="#111827" stroke="#334155" stroke-width="2" />
    <!-- Neck Light Rim -->
    <path d="M320 620 C350 645 450 645 480 620" fill="none" stroke="#00f5ff" stroke-width="3" stroke-linecap="round" filter="url(#glowFilter)" />
  </g>

  <!-- Neck -->
  <path d="M340 490 L340 590 C370 605 430 605 460 590 L460 490 Z" fill="#2d221c" />

  <!-- Head / Face Silhouette Base -->
  <g id="portrait-face">
    <!-- Ears -->
    <ellipse cx="270" cy="385" rx="16" ry="28" fill="#5c4538" />
    <ellipse cx="530" cy="385" rx="16" ry="28" fill="#5c4538" />

    <!-- Face Oval -->
    <path d="M280 340 C270 230 350 180 400 180 C450 180 530 230 520 340 C515 420 470 490 400 500 C330 490 285 420 280 340 Z" fill="url(#faceShade)" />

    <!-- Cyber-Rim Lighting on Face Contours -->
    <!-- Cyan Rim (Left) -->
    <path d="M282 310 C278 360 295 440 370 485" fill="none" stroke="#00f5ff" stroke-width="3.5" stroke-opacity="0.8" filter="url(#glowFilter)" />
    <!-- Red/Violet Rim (Right) -->
    <path d="M518 310 C522 360 505 440 430 485" fill="none" stroke="#ff0055" stroke-width="3" stroke-opacity="0.6" filter="url(#glowFilter)" />

    <!-- Hair (Futuristic Modern Cut) -->
    <path d="M275 320 C265 240 310 160 400 155 C480 150 535 220 525 320 C515 250 490 200 400 200 C320 200 285 260 275 320 Z" fill="#0d1117" />
    <path d="M275 280 C290 190 380 145 425 140 C490 135 540 180 525 280 C500 210 460 170 395 175 C335 180 295 220 275 280 Z" fill="#1a2234" />

    <!-- Facial Features (Sculpted, Cinematic) -->
    <!-- Eyebrows -->
    <path d="M320 330 C345 322 375 326 385 334" fill="none" stroke="#1f1814" stroke-width="4.5" stroke-linecap="round" />
    <path d="M480 330 C455 322 425 326 415 334" fill="none" stroke="#1f1814" stroke-width="4.5" stroke-linecap="round" />

    <!-- Eyes (Focused, Intelligent) -->
    <g id="eyes">
      <!-- Left Eye -->
      <path d="M325 350 C345 342 368 344 380 355 C368 362 345 362 325 350 Z" fill="#100b08" />
      <circle cx="355" cy="352" r="6" fill="#3b2b20" />
      <circle cx="355" cy="352" r="3" fill="#000000" />
      <circle cx="357" cy="350" r="1.5" fill="#ffffff" />
      <!-- Subtle Cyan Pupil Gleam -->
      <circle cx="354" cy="353" r="1.2" fill="#00f5ff" />

      <!-- Right Eye -->
      <path d="M475 350 C455 342 432 344 420 355 C432 362 455 362 475 350 Z" fill="#100b08" />
      <circle cx="445" cy="352" r="6" fill="#3b2b20" />
      <circle cx="445" cy="352" r="3" fill="#000000" />
      <circle cx="447" cy="350" r="1.5" fill="#ffffff" />
      <!-- Subtle Red Pupil Gleam -->
      <circle cx="446" cy="353" r="1.2" fill="#ff0055" />
    </g>

    <!-- Nose Bridge & Tip -->
    <path d="M400 336 L395 400 L388 412 C395 418 405 418 412 412 L405 400 Z" fill="#503b30" />
    <path d="M394 402 L388 412" stroke="#2b1f19" stroke-width="1.5" stroke-linecap="round" />
    <path d="M406 402 L412 412" stroke="#2b1f19" stroke-width="1.5" stroke-linecap="round" />

    <!-- Lips -->
    <path d="M370 448 C388 443 412 443 430 448 C415 458 385 458 370 448 Z" fill="#543730" />
    <path d="M374 448 C390 445 410 445 426 448" stroke="#261713" stroke-width="1.5" />

    <!-- Cyber Cheek/Temple HUD Marker -->
    <circle cx="490" cy="375" r="3" fill="#00f5ff" filter="url(#glowFilter)" />
    <path d="M495 375 L508 375 L515 390" fill="none" stroke="#00f5ff" stroke-width="1.2" stroke-opacity="0.8" />
  </g>

  <!-- Atmospheric Cosmic Ring Surrounding Portrait -->
  <ellipse cx="400" cy="460" rx="290" ry="380" fill="none" stroke="url(#neonCyan)" stroke-width="1" stroke-dasharray="4,8" opacity="0.4" />
  <ellipse cx="400" cy="460" rx="310" ry="400" fill="none" stroke="#0066ff" stroke-width="0.8" stroke-dasharray="12,16" opacity="0.3" />

  <!-- Subtle Web Geometry Accents (Hinting at the Spider Energy) -->
  <g opacity="0.25">
    <path d="M220 700 L250 660 L310 680" fill="none" stroke="#ff0055" stroke-width="1" />
    <path d="M580 700 L550 660 L490 680" fill="none" stroke="#00f5ff" stroke-width="1" />
  </g>
</svg>